<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<script src="https://unpkg.com/html5-qrcode"></script>
<title>V&V Cashier Panel</title>

<style>
body{
 margin:0;
 background:#0b0b0f;
 color:white;
 font-family:Arial, sans-serif;
 padding:25px;
}

.panel{
 max-width:430px;
 margin:auto;
 background:#111119;
 padding:24px;
 border-radius:28px;
 border:1px solid rgba(214,178,94,.35);
}

h1{
 color:#d6b25e;
 letter-spacing:2px;
}

input, textarea{
 width:100%;
 box-sizing:border-box;
 padding:12px;
 border-radius:12px;
 border:none;
 margin-top:10px;
 outline:none;
 user-select:text;
 -webkit-user-select:text;
 -webkit-touch-callout:default;
}

textarea{
 height:90px;
 resize:none;
}

button{
 width:100%;
 border:none;
 border-radius:18px;
 padding:16px;
 font-weight:bold;
 background:#d6b25e;
 color:#111;
 cursor:pointer;
 margin-top:12px;
}

.secondary{
 background:#1f1f2a;
 color:#d6b25e;
 border:1px solid rgba(214,178,94,.3);
}

.error{
 display:none;
 color:#ff6b6b;
 font-size:13px;
 margin-top:10px;
}

.success{
 display:none;
 color:#6ee7b7;
 font-size:13px;
 margin-top:10px;
}

.card{
 background:#15151d;
 border-radius:20px;
 padding:18px;
 margin-top:18px;
}

.lang-switcher{
 display:flex;
 gap:8px;
 margin-bottom:18px;
}

.lang-switcher button{
 flex:1;
 width:auto;
 margin-top:0;
 padding:10px 0;
 border-radius:999px;
 background:#1f1f2a;
 border:1px solid rgba(214,178,94,.28);
 color:#aaa;
}

.lang-switcher button.active{
 background:#d6b25e;
 color:#111;
 border-color:#d6b25e;
}
</style>
</head>

<body>
<div id="pinScreen" style="
position:fixed;
inset:0;
background:#0b0b0f;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
padding:25px;
box-sizing:border-box;
">
 <div style="
 max-width:360px;
 width:100%;
 background:#111119;
 padding:28px;
 border-radius:28px;
 border:1px solid rgba(214,178,94,.35);
 text-align:center;
 ">
  <div class="lang-switcher">
   <button onclick="setLanguage('ro')">RO</button>
   <button onclick="setLanguage('ru')">RU</button>
   <button onclick="setLanguage('en')">EN</button>
  </div>

  <h2 style="color:#d6b25e;" data-i18n="cashierAccess">Cashier Access</h2>
  <p style="color:#aaa;" data-i18n="enterCashierPin">Enter cashier PIN</p>

  <input id="cashierPin" type="password" placeholder="PIN" data-i18n-placeholder="pin" style="
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:14px;
  border:none;
  margin-top:10px;
  ">

  <button id="pinButton" onclick="checkPin()" data-i18n="enter" style="
  width:100%;
  border:none;
  border-radius:18px;
  padding:16px;
  font-weight:bold;
  background:#d6b25e;
  color:#111;
  cursor:pointer;
  margin-top:14px;
  ">
  Enter
  </button>

  <div id="pinError" style="
  display:none;
  color:#ff6b6b;
  margin-top:12px;
  font-size:13px;
  ">
  Wrong PIN
  </div>
 </div>
</div>
<div class="panel">
<div class="lang-switcher">
 <button onclick="setLanguage('ro')">RO</button>
 <button onclick="setLanguage('ru')">RU</button>
 <button onclick="setLanguage('en')">EN</button>
</div>

<h1 data-i18n="cashierTitle">V&V Cashier</h1>

<div class="card">
<h3 data-i18n="clientQr">Client QR</h3>
<textarea id="qrInput" placeholder="Paste scanned QR here" data-i18n-placeholder="pasteQr"></textarea>
<button class="secondary" onclick="startScanner()" data-i18n="openScanner">Open Camera Scanner</button>

<div id="reader" style="
display:none;
margin-top:15px;
border-radius:18px;
overflow:hidden;">
</div>
</div>

<div class="card">
<h3 data-i18n="addPurchase">Add Purchase</h3>

<input id="purchaseAmount"
type="number"
min="1"
placeholder="Purchase amount"
data-i18n-placeholder="purchaseAmount">

<input id="productName"
type="text"
placeholder="Product name"
data-i18n-placeholder="productName">

<button onclick="addPurchase()"
data-i18n="addPurchaseBonus"
>
Add purchase bonus
</button>

</div>

<div class="card">
<h3 data-i18n="redeemPointsTitle">Redeem Points</h3>
<input id="redeemPurchaseAmount" type="number" min="0" placeholder="Purchase amount" data-i18n-placeholder="purchaseAmount">
<input id="redeemAmount" type="number" min="1" placeholder="Points to redeem" data-i18n-placeholder="pointsToRedeem">
<button class="secondary" onclick="redeemPoints()"
data-i18n="redeemPoints"
>Redeem points</button>
</div>

<div id="errorMsg" class="error"></div>
<div id="successMsg" class="success"></div>

<div class="card">
<h3 data-i18n="clientResult">Client Result</h3>
<p><span data-i18n="balance">Balance</span>: <span id="balance">—</span> MDL</p>
<p><span data-i18n="status">Status</span>: <span id="tier">—</span></p>
</div>

</div>

<script>
const API = "https://vv-loyalty-app.onrender.com";
let cashierUnlocked = false;
let currentLang = localStorage.getItem("cashierLang") || localStorage.getItem("lang") || "ro";

const translations = {
 ro:{
  cashierAccess:"Acces casier",
  enterCashierPin:"Introdu PIN-ul casierului",
  pin:"PIN",
  enter:"Intra",
  checking:"Verificare...",
  wrongPin:"PIN gresit",
  enterPin:"Introdu PIN-ul",
  connectionError:"Eroare de conexiune",
  cashierTitle:"V&V Casier",
  clientQr:"QR client",
  pasteQr:"Lipeste QR-ul scanat aici",
  openScanner:"Deschide camera",
  addPurchase:"Adauga cumparare",
  purchaseAmount:"Suma cumpararii",
  productName:"Numele produsului",
  addPurchaseBonus:"Adauga bonusul",
  redeemPointsTitle:"Utilizare puncte",
  pointsToRedeem:"Puncte de utilizat",
  redeemPoints:"Utilizeaza puncte",
  clientResult:"Rezultat client",
  balance:"Balanta",
  status:"Statut",
  enterCashierFirst:"Introdu mai intai PIN-ul casierului",
  clientLoadingError:"Eroare la incarcarea clientului",
  invalidClientData:"Date client invalide",
  scanQrFirst:"Scaneaza sau lipeste mai intai QR-ul clientului",
  enterPurchaseAmount:"Introdu suma cumpararii",
  purchaseError:"Eroare cumparare",
  bonusAdded:"Bonus adaugat cu succes",
  enterPointsAmount:"Introdu numarul de puncte",
  redeemError:"Eroare utilizare puncte",
  pointsRedeemed:"Puncte utilizate cu succes",
  qrScanned:"QR scanat cu succes",
  cashback:"Cashback"
 },
 ru:{
  cashierAccess:"Доступ кассира",
  enterCashierPin:"Введите PIN кассира",
  pin:"PIN",
  enter:"Войти",
  checking:"Проверка...",
  wrongPin:"Неверный PIN",
  enterPin:"Введите PIN",
  connectionError:"Ошибка соединения",
  cashierTitle:"V&V Касса",
  clientQr:"QR клиента",
  pasteQr:"Вставьте сканированный QR",
  openScanner:"Открыть камеру",
  addPurchase:"Добавить покупку",
  purchaseAmount:"Сумма покупки",
  productName:"Название товара",
  addPurchaseBonus:"Начислить бонус",
  redeemPointsTitle:"Списать баллы",
  pointsToRedeem:"Баллы к списанию",
  redeemPoints:"Списать баллы",
  clientResult:"Данные клиента",
  balance:"Баланс",
  status:"Статус",
  enterCashierFirst:"Сначала введите PIN кассира",
  clientLoadingError:"Ошибка загрузки клиента",
  invalidClientData:"Некорректные данные клиента",
  scanQrFirst:"Сначала отсканируйте или вставьте QR клиента",
  enterPurchaseAmount:"Введите сумму покупки",
  purchaseError:"Ошибка покупки",
  bonusAdded:"Бонус успешно начислен",
  enterPointsAmount:"Введите количество баллов",
  redeemError:"Ошибка списания",
  pointsRedeemed:"Баллы успешно списаны",
  qrScanned:"QR успешно отсканирован",
  cashback:"Cashback"
 },
 en:{
  cashierAccess:"Cashier Access",
  enterCashierPin:"Enter cashier PIN",
  pin:"PIN",
  enter:"Enter",
  checking:"Checking...",
  wrongPin:"Wrong PIN",
  enterPin:"Enter PIN",
  connectionError:"Connection error",
  cashierTitle:"V&V Cashier",
  clientQr:"Client QR",
  pasteQr:"Paste scanned QR here",
  openScanner:"Open Camera Scanner",
  addPurchase:"Add Purchase",
  purchaseAmount:"Purchase amount",
  productName:"Product name",
  addPurchaseBonus:"Add purchase bonus",
  redeemPointsTitle:"Redeem Points",
  pointsToRedeem:"Points to redeem",
  redeemPoints:"Redeem points",
  clientResult:"Client Result",
  balance:"Balance",
  status:"Status",
  enterCashierFirst:"Enter cashier PIN first",
  clientLoadingError:"Client loading error",
  invalidClientData:"Invalid client data",
  scanQrFirst:"Scan or paste client QR first",
  enterPurchaseAmount:"Enter purchase amount",
  purchaseError:"Purchase error",
  bonusAdded:"Bonus added successfully",
  enterPointsAmount:"Enter points amount",
  redeemError:"Redeem error",
  pointsRedeemed:"Points redeemed successfully",
  qrScanned:"QR scanned successfully",
  cashback:"Cashback"
 }
};

function t(key){
 return (translations[currentLang] || translations.ro)[key] || translations.ro[key] || key;
}

function applyLanguage(){
 document.querySelectorAll("[data-i18n]").forEach(element=>{
  const key = element.dataset.i18n;
  element.innerText = t(key);
 });

 document.querySelectorAll("[data-i18n-placeholder]").forEach(element=>{
  const key = element.dataset.i18nPlaceholder;
  element.placeholder = t(key);
 });

 document.querySelectorAll(".lang-switcher button").forEach(button=>{
  button.classList.toggle(
   "active",
   button.innerText.toLowerCase() === currentLang
  );
 });
}

function setLanguage(lang){
 currentLang = translations[lang] ? lang : "ro";
 localStorage.setItem("cashierLang", currentLang);
 localStorage.setItem("lang", currentLang);
 applyLanguage();
}

function cashierHeaders(){
 return {
  "x-cashier-pin": document.getElementById("cashierPin").value
 };
}

function requireCashierAccess(){
 if(cashierUnlocked){
  return true;
 }

 document.getElementById("pinScreen").style.display = "flex";
 showError(t("enterCashierFirst"));
 return false;
}

async function loadClientResult(){
 if(!requireCashierAccess()) return;

 const qr=document.getElementById("qrInput").value.trim();
 const clientId=getClientIdFromQR(qr);

 if(!clientId) return;

const res=await fetch(API + "/user/" + clientId,{
 headers:cashierHeaders()
});
 const data=await res.json();

 if(!res.ok || data.error){
  showError(data.error || t("clientLoadingError"));
  return;
 }

 updateResult(data);
}
function clearMessages(){
 document.getElementById("errorMsg").style.display="none";
 document.getElementById("successMsg").style.display="none";
}

function getClientIdFromQR(qr){
  if(!qr) return null;
  const parts = qr.split(":");

  if(parts.length !== 3 || !/^\d+$/.test(parts[0])){
   return null;
  }

  return parts[0];
}

function showError(text){
 const box=document.getElementById("errorMsg");
 box.innerText=text;
 box.style.display="block";
}

function showSuccess(text){
 const box=document.getElementById("successMsg");
 box.innerText=text;
 box.style.display="block";
}

function updateResult(data){
 if(!data || !data.tier){
  showError(t("invalidClientData"));
  return;
 }

 document.getElementById("balance").innerText =
 Number(data.balance).toFixed(2);

 document.getElementById("tier").innerText =
 data.tier.name + " - " + t("cashback") + " " + data.tier.cashback + "%";
}

async function addPurchase(){
 clearMessages();
 if(!requireCashierAccess()) return;

 const qr=document.getElementById("qrInput").value.trim();
 const amount=document.getElementById("purchaseAmount").value;
const product=document.getElementById("productName").value.trim();

 if(!qr){
   showError(t("scanQrFirst"));
   return;
 }

 if(!amount || Number(amount)<=0){
   showError(t("enterPurchaseAmount"));
   return;
 }

 const res=await fetch(API + "/scan",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
body:JSON.stringify({
 qr:qr,
 amount:Number(amount),
 product:product,
 pin:document.getElementById("cashierPin").value
})
});

 const data=await res.json();

 if(!res.ok){
   showError(data.error || t("purchaseError"));
   return;
 }

 updateResult(data);
 showSuccess(t("bonusAdded"));
 document.getElementById("purchaseAmount").value="";
document.getElementById("productName").value="";
}

async function redeemPoints(){
 clearMessages();
 if(!requireCashierAccess()) return;

 const qr=document.getElementById("qrInput").value.trim();
 const purchaseAmount=document.getElementById("redeemPurchaseAmount").value;
 const points=document.getElementById("redeemAmount").value;

 const clientId=getClientIdFromQR(qr);

 if(!clientId){
   showError(t("scanQrFirst"));
   return;
 }

 if(!points || Number(points)<=0){
   showError(t("enterPointsAmount"));
   return;
 }

 if(purchaseAmount === "" || Number(purchaseAmount)<0){
   showError(t("enterPurchaseAmount"));
   return;
 }

 const res=await fetch(API + "/redeem",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
body:JSON.stringify({
 id:clientId,
 points:Number(points),
 purchaseAmount:Number(purchaseAmount),
 pin:document.getElementById("cashierPin").value
})
 });

 const data=await res.json();

 if(!res.ok){
   showError(data.error || t("redeemError"));
   return;
 }

 updateResult(data);
showSuccess(t("pointsRedeemed"));
 document.getElementById("redeemPurchaseAmount").value="";
 document.getElementById("redeemAmount").value="";
}
let qrScanner = null;

function startScanner(){
 if(!requireCashierAccess()) return;

 const reader = document.getElementById("reader");
 reader.style.display = "block";

 if(qrScanner){
   qrScanner.clear();
 }

 qrScanner = new Html5Qrcode("reader");

 qrScanner.start(
   { facingMode: "environment" },
   {
     fps: 10,
     qrbox: { width: 250, height: 250 }
   },
   (decodedText) => {
     document.getElementById("qrInput").value = decodedText;

     qrScanner.stop();
     reader.style.display = "none";

     showSuccess(t("qrScanned"));
     loadClientResult();
   },
   () => {}
 );
}
async function checkPin(){
 const pinInput = document.getElementById("cashierPin");
 const pinError = document.getElementById("pinError");
 const pinButton = document.getElementById("pinButton");
 const pin = pinInput.value.trim();

 pinError.style.display = "none";

 if(!pin){
  pinError.innerText = t("enterPin");
  pinError.style.display = "block";
  return;
 }

 pinButton.disabled = true;
 pinButton.innerText = t("checking");

 try{
  const res = await fetch(API + "/cashier/check",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "x-cashier-pin":pin
   },
   body:JSON.stringify({ pin })
  });
  const data = await res.json();

  if(!res.ok || data.error){
   cashierUnlocked = false;
   pinError.innerText = data.error || t("wrongPin");
   pinError.style.display = "block";
   return;
  }

  cashierUnlocked = true;
  document.getElementById("pinScreen").style.display = "none";
 } catch(error){
  cashierUnlocked = false;
  pinError.innerText = t("connectionError");
  pinError.style.display = "block";
 } finally{
  pinButton.disabled = false;
  pinButton.innerText = t("enter");
 }
}

document.getElementById("cashierPin").addEventListener("keydown",(event)=>{
 if(event.key === "Enter"){
  checkPin();
 }
});

applyLanguage();
</script>

</body>
</html>
